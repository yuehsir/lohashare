manifest_version: "0.1"

module:
  name: "Email Fallback Provider POC"
  code: "email_notification_fallback_poc"
  path: "docs/LOHAShare_AI_Platform/02_Modules/Email_Notification/Fallback_POC"
  level: "Level 4"
  type: "module_derived_poc"
  status: "planning"
  owner: "LOHAShare"

parent_context:
  platform: "LOHAShare AI Platform"
  main_prd: "LOHAShare AI 商務網站營運控制台"
  first_mvp: "LOHAShare AI Lead & Notification Console MVP"
  parent_module: "Email Notification"
  related_subsystem:
    - "Lead Console"
    - "Nexus Lead Ops"

positioning_rules:
  - "This POC is a module-derived document and implementation branch."
  - "This POC is not the main PRD."
  - "Nexus Lead Ops is not the main PRD."
  - "Email Fallback Provider POC must not directly modify production email flow."

purpose:
  summary: "建立獨立 Email Provider Test Console，用於測試替代 Email provider 的寄信能力與 fallback 可行性。"
  goals:
    - "測試 Resend、ZeptoMail、Postmark、SMTP 等 provider 的寄信能力。"
    - "記錄每次測試的 provider response、收件端、測試時間與結果。"
    - "協助判斷 Lovable / Mailgun / DNS / 收件端 reputation 問題。"
    - "作為未來 Email Notification Module fallback provider 架構的驗證依據。"

scope:
  in_scope:
    - "建立獨立 Replit Email Provider Test Console。"
    - "支援輸入收件人、標題、內容與 provider。"
    - "支援測試結果紀錄。"
    - "支援匯出測試紀錄。"
    - "支援 provider adapter 架構。"
  out_of_scope:
    - "不修改 Lovable production 專案。"
    - "不修改 notify.lohashare.com DNS。"
    - "不修改 Mailgun / Lovable Emails 主線。"
    - "不修改 dispatchLeadNotification。"
    - "不修改 process-email-queue。"
    - "不直接接入正式 production email flow。"

