name: Docs Governance Check

on:
  workflow_dispatch:
  push:
    paths:
      - "docs/LOHAShare_AI_Platform/**"
      - ".github/workflows/docs-governance-check.yml"

jobs:
  governance-check:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Confirm root folder exists
        run: |
          test -d "docs/LOHAShare_AI_Platform"

      - name: Check required top-level folders
        run: |
          required=(
            "docs/LOHAShare_AI_Platform/00_Index"
            "docs/LOHAShare_AI_Platform/00_Main_PRD"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance"
            "docs/LOHAShare_AI_Platform/02_Modules"
            "docs/LOHAShare_AI_Platform/03_SOP_and_QA"
            "docs/LOHAShare_AI_Platform/04_Support_Knowledge_Base"
            "docs/LOHAShare_AI_Platform/05_Developer_Prompts"
            "docs/LOHAShare_AI_Platform/06_Release_Notes"
            "docs/LOHAShare_AI_Platform/07_Archive"
          )

          for folder in "${required[@]}"; do
            if [ ! -d "$folder" ]; then
              echo "Missing required top-level folder: $folder"
              exit 1
            fi
          done

          echo "Top-level folder check passed."
          
      - name: Check 00_Index Current and Archive structure
        run: |
          required_index=(
            "docs/LOHAShare_AI_Platform/00_Index/Current"
            "docs/LOHAShare_AI_Platform/00_Index/99_Archive"
          )

          for folder in "${required_index[@]}"; do
            if [ ! -d "$folder" ]; then
              echo "Missing 00_Index folder: $folder"
              exit 1
            fi
          done

          required_index_files=(
            "docs/LOHAShare_AI_Platform/00_Index/README.md"
            "docs/LOHAShare_AI_Platform/00_Index/Current/README.txt"
            "docs/LOHAShare_AI_Platform/00_Index/99_Archive/README.txt"
          )

          for file in "${required_index_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing 00_Index README file: $file"
              exit 1
            fi
          done

          echo "00_Index Current / 99_Archive structure check passed."
          
      - name: Check forbidden root folders and naming errors
        run: |
          forbidden=(
            "docs/LOHAShare_AI_Platform/Scripts"
            "docs/LOHAShare_AI_Platform/Support"
            "docs/LOHAShare_AI_Platform/04_Support_Knowledge_Base/00_Management_Spec"
            "docs/LOHAShare_AI_Platform/02_Modules/lead-console"
            "docs/LOHAShare_AI_Platform/05_Developer_Prompts/Email_Notification/Fallback_ROC"
          )

          for folder in "${forbidden[@]}"; do
            if [ -e "$folder" ]; then
              echo "Forbidden folder or naming error exists: $folder"
              exit 1
            fi
          done

          echo "Forbidden folder check passed."

      - name: Check required module and prompt folders
        run: |
          required_modules=(
            "docs/LOHAShare_AI_Platform/02_Modules/Email_Notification/Fallback_POC"
            "docs/LOHAShare_AI_Platform/02_Modules/Lead_Console"
            "docs/LOHAShare_AI_Platform/02_Modules/Referral"
            "docs/LOHAShare_AI_Platform/05_Developer_Prompts/DocOps_MVP"
            "docs/LOHAShare_AI_Platform/05_Developer_Prompts/Email_Notification/Fallback_POC"
          )

          for folder in "${required_modules[@]}"; do
            if [ ! -d "$folder" ]; then
              echo "Missing required module/prompt folder: $folder"
              exit 1
            fi
          done

          echo "Module and prompt folder check passed."

      - name: Check Developer_Prompts is not inside 02_Modules
        run: |
          if find "docs/LOHAShare_AI_Platform/02_Modules" -type d -name "Developer_Prompts" | grep -q .; then
            echo "Developer_Prompts folder must not exist inside 02_Modules"
            exit 1
          fi

          echo "Developer_Prompts placement check passed."

      - name: Check Architecture Governance second-level structure
        run: |
          required_governance=(
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/00_Current_Index"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/01_Document_Governance/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/01_Document_Governance/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/02_Modular_Architecture/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/02_Modular_Architecture/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/03_Automation_DocOps/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/03_Automation_DocOps/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/04_Content_Quality_and_Consolidation/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/04_Content_Quality_and_Consolidation/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/05_Support_KB_Governance/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/05_Support_KB_Governance/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/06_Tooling_and_Escalation/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/06_Tooling_and_Escalation/99_Archive"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/07_Visuals/Current"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/07_Visuals/99_Archive"
          )

          for folder in "${required_governance[@]}"; do
            if [ ! -d "$folder" ]; then
              echo "Missing Architecture Governance folder: $folder"
              exit 1
            fi
          done

          echo "Architecture Governance second-level structure check passed."

      - name: Check Architecture Governance root README files
        run: |
          required_files=(
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/README.md"
            "docs/LOHAShare_AI_Platform/01_Architecture_Governance/00_Current_Index/README_Current_Governance_Index.md"
          )

          for file in "${required_files[@]}"; do
            if [ ! -f "$file" ]; then
              echo "Missing required governance README file: $file"
              exit 1
            fi
          done

          echo "Architecture Governance README check passed."

      - name: Check Architecture Governance root should not contain loose governance docs
        run: |
          root_docs=$(find "docs/LOHAShare_AI_Platform/01_Architecture_Governance" -maxdepth 1 -type f \( -name "*.docx" -o -name "*.md" -o -name "*.png" \) ! -name "README.md" | wc -l)

          if [ "$root_docs" -gt 0 ]; then
            echo "Loose governance documents found in 01_Architecture_Governance root."
            echo "Governance documents should be placed under topic folders Current/ or 99_Archive/."
            find "docs/LOHAShare_AI_Platform/01_Architecture_Governance" -maxdepth 1 -type f \( -name "*.docx" -o -name "*.md" -o -name "*.png" \) ! -name "README.md"
            exit 1
          fi

          echo "No loose governance documents found in Architecture Governance root."
          
      - name: Check 00_Index root should not contain loose index documents
        run: |
          loose_index_docs=$(find "docs/LOHAShare_AI_Platform/00_Index" -maxdepth 1 -type f \( -name "*.docx" -o -name "*.md" \) ! -name "README.md" | wc -l)

          if [ "$loose_index_docs" -gt 0 ]; then
            echo "Loose index documents found in 00_Index root."
            echo "Index documents should be placed under Current/ or 99_Archive/."
            find "docs/LOHAShare_AI_Platform/00_Index" -maxdepth 1 -type f \( -name "*.docx" -o -name "*.md" \) ! -name "README.md"
            exit 1
          fi

          echo "No loose index documents found in 00_Index root."

      - name: Governance check passed
        run: |
          echo "LOHAShare AI Platform document governance check passed."
